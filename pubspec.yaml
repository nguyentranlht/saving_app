name: so_thu_chi
description: Sổ thu chi - ứng dụng quản lý chi tiêu cá nhân.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Tạo icon app: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/Ting-Ting-logo/app-icon/ting-ting-appstore-1024.png"
  ios: true
  remove_alpha_ios: true
  android: true
  min_sdk_android: 21
  # Android 8+: nền xanh + logo thu nhỏ vào vùng an toàn để không bị cắt khi bo tròn.
  adaptive_icon_background: "#0B5D4B"
  adaptive_icon_foreground: "assets/Ting-Ting-logo/app-icon/ting-ting-android-foreground.png"
